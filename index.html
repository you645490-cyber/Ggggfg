<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⫷ فِــيْلَــقُ مِــدْجَــايْ 𓂀⃝☥ ⫸ 𝐀𝐊7</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Cinzel', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0505;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== الخلفية الفرعونية من رابط الصورة ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://as1.ftcdn.net/v2/jpg/02/18/99/90/1000_F_218999080_QqP6LJcPqZ6d5usYw8upuFoRyBM4TCCk.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.25; /* خفيفة عشان النص يبان فوقها بوضوح */
            z-index: 0;
            animation: none;
        }

        /* ===== زخارف متحركة في الخلفية ===== */
        .hieroglyphs-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            font-size: 6rem;
            color: rgba(212, 175, 55, 0.04);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            animation: floatGlyphs 20s linear infinite;
        }

        @keyframes floatGlyphs {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(3deg); }
        }

        .hieroglyphs-bg span {
            display: inline-block;
            animation: spinSlow 30s linear infinite;
        }

        @keyframes spinSlow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* ===== الكارت الفخم ===== */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(10, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 50px 50px 50px 50px;
            max-width: 520px;
            width: 100%;
            border: 2px solid transparent;
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.1), 0 0 20px rgba(212, 175, 55, 0.2);
            transition: 0.5s;
            background-clip: padding-box;
            border-image: linear-gradient(135deg, #d4af37, #f5e6a3, #b8860b, #d4af37) 1;
            animation: borderGlow 4s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            0% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.2), inset 0 0 30px rgba(212, 175, 55, 0.02); }
            100% { box-shadow: 0 0 60px rgba(212, 175, 55, 0.4), inset 0 0 60px rgba(212, 175, 55, 0.05); }
        }

        /* ===== الشريط الذهبي ===== */
        .gold-bar {
            width: 80%;
            height: 3px;
            margin: 0 auto 25px auto;
            background: linear-gradient(90deg, transparent, #d4af37, #f5e6a3, #b8860b, transparent);
            border-radius: 10px;
            animation: barSlide 3s ease-in-out infinite;
            background-size: 200% 100%;
        }

        @keyframes barSlide {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ===== العنوان ===== */
        .header-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-title h1 {
            font-family: 'Cinzel', 'Cairo', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #f5e6a3;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.4), 0 0 80px rgba(212, 175, 55, 0.1);
            line-height: 1.5;
            letter-spacing: 4px;
        }

        .header-title h1 .highlight { color: #d4af37; text-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }
        .header-title h1 small {
            display: block;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            color: #b8860b;
            letter-spacing: 6px;
            margin-top: 8px;
            border-top: 1px dashed rgba(212, 175, 55, 0.2);
            padding-top: 12px;
            font-weight: 400;
        }

        /* ===== الحقول ===== */
        .input-group {
            margin-bottom: 22px;
        }
        .input-group label {
            display: block;
            color: #d4af37;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 2px;
            font-family: 'Cinzel', sans-serif;
        }
        .input-group label i { font-style: normal; margin-left: 10px; color: #f5e6a3; }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #7a5a2a;
            border-radius: 20px;
            color: #f5e6d3;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: 0.4s;
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.6);
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 4px 15px rgba(0, 0, 0, 0.6);
            background: rgba(20, 10, 5, 0.9);
            transform: scale(1.01);
        }
        .input-group textarea { min-height: 130px; resize: vertical; }

        /* ===== الأزرار ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 15px;
        }
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #d4af37, #b8860b, #8b6508);
            border: none;
            border-radius: 20px;
            color: #0a0505;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 4px 30px rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-family: 'Cinzel', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .btn-primary:active { transform: scale(0.96); box-shadow: 0 2px 15px rgba(212, 175, 55, 0.2); }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid #b8860b;
            border-radius: 20px;
            color: #d4af37;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Cairo', sans-serif;
            backdrop-filter: blur(5px);
        }
        .btn-secondary:active { background: rgba(212, 175, 55, 0.15); border-color: #d4af37; transform: scale(0.98); }

        .btn-clear {
            width: 100%;
            padding: 12px;
            background: rgba(100, 50, 30, 0.1);
            border: 1px dashed #7a3a2a;
            border-radius: 16px;
            color: #a06040;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .btn-clear:active { background: rgba(100, 50, 30, 0.2); border-color: #a06040; }

        /* ===== الإشعارات ===== */
        .toast-msg {
            background: rgba(212, 175, 55, 0.05);
            border-right: 4px solid #d4af37;
            color: #f5e6d3;
            padding: 14px 20px;
            border-radius: 16px;
            margin-top: 18px;
            font-size: 0.95rem;
            text-align: center;
            display: none;
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(212, 175, 55, 0.1);
        }
        .toast-msg.show { display: block; animation: fadeSlide 0.5s ease; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            color: #7a6a5a;
            font-size: 0.75rem;
            border-top: 1px solid rgba(212, 175, 55, 0.08);
            padding-top: 20px;
            letter-spacing: 2px;
            font-family: 'Cinzel', sans-serif;
        }
        .footer-note strong { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .icon-lg { font-size: 1.6rem; }

        @media (max-width: 480px) {
            .card { padding: 25px 18px; border-radius: 30px; }
            .header-title h1 { font-size: 1.4rem; }
            .btn-primary { font-size: 1rem; padding: 15px; }
            .hieroglyphs-bg { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="hieroglyphs-bg">
        <span>𓂀</span> <span>𓋹</span> <span>𓆣</span> <span>𓅃</span>
        <span>𓂀</span> <span>𓋹</span> <span>𓆣</span> <span>𓅃</span>
        <span>𓂀</span> <span>𓋹</span> <span>𓆣</span> <span>𓅃</span>
        <span>𓂀</span> <span>𓋹</span> <span>𓆣</span> <span>𓅃</span>
    </div>

    <div class="card">
        <div class="gold-bar"></div>
        <div class="header-title">
            <h1>
                <span class="highlight">𓂀</span>
                ⫷ فِــيْلَــقُ مِــدْجَــايْ
                <span style="display:inline-block;color:#d4af37;">𓂀⃝☥</span>
                ⫸
                <span style="color:#f5e6a3;font-size:1.8rem;">𝐀𝐊7</span>
                <small>⚜️ الإرسال السريع إلى البريد الإلكتروني ⚜️</small>
            </h1>
        </div>

        <form id="emailForm">
            <div class="input-group">
                <label><i>𓋹</i> البريد المستلم</label>
                <input type="email" id="toEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label><i>𓆣</i> الموضوع</label>
                <input type="text" id="subject" placeholder="عنوان البريد..." required>
            </div>
            <div class="input-group">
                <label><i>𓅃</i> محتوى الرسالة</label>
                <textarea id="body" placeholder="اكتب نص الرسالة هنا..." required></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-primary">
                    <span class="icon-lg">📨</span> إرسال عبر البريد (تطبيق)
                </button>
                <button type="button" class="btn-secondary" id="webBtn">
                    <span class="icon-lg">🌐</span> فتح Gmail في المتصفح
                </button>
                <button type="button" class="btn-clear" id="clearBtn">
                    🗑️ تفريغ الحقول (بداية جديدة)
                </button>
            </div>
        </form>

        <div id="infoToast" class="toast-msg">✅ تم التوجيه بنجاح...</div>
        <div class="footer-note"><strong>𓂀</strong> البيانات تبقى محفوظة للتعديل السريع <strong>𓋹</strong></div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const toast = document.getElementById('infoToast');
        const toInput = document.getElementById('toEmail');
        const subInput = document.getElementById('subject');
        const bodyInput = document.getElementById('body');
        const webBtn = document.getElementById('webBtn');
        const clearBtn = document.getElementById('clearBtn');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function getPreparedLink(type) {
            const to = toInput.value.trim();
            const subject = subInput.value.trim();
            const body = bodyInput.value.trim();
            if (!to || !subject || !body) {
                alert('⚠️ من فضلك املأ جميع الحقول!');
                return null;
            }
            const encSub = encodeURIComponent(subject);
            const encBody = encodeURIComponent(body);
            if (type === 'mailto') {
                return `mailto:${to}?subject=${encSub}&body=${encBody}`;
            } else {
                return `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${encSub}&body=${encBody}`;
            }
        }

        // 🔥 تحسين سرعة الانتقال لتطبيق Gmail
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const link = getPreparedLink('mailto');
            if (!link) return;
            showToast(`✅ جارٍ فتح البريد... المستلم: ${toInput.value}`);
            // فتح الرابط في نفس التبويب لتسريع الانتقال للتطبيق
            window.location.href = link;
        });

        webBtn.addEventListener('click', function() {
            const link = getPreparedLink('web');
            if (!link) return;
            showToast(`✅ جارٍ فتح Gmail في المتصفح... المستلم: ${toInput.value}`);
            window.open(link, '_blank');
        });

        clearBtn.addEventListener('click', function() {
            if (confirm('⚠️ هل أنت متأكد؟ هيمسح كل البيانات.')) {
                toInput.value = '';
                subInput.value = '';
                bodyInput.value = '';
                showToast('🗑️ تم تفريغ الحقول.');
            }
        });
    </script>
</body>
</html>
