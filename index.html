<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 الإرسال السريع Gmail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .card {
            background: #1a202c;
            padding: 30px 25px;
            border-radius: 28px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #2d3748;
        }
        h2 {
            color: #63b3ed;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 700;
        }
        h2 span {
            background: #e53e3e;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: #0d1117;
            border: 1px solid #2d3748;
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }
        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.2);
        }
        .input-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4299e1, #3182ce);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(66, 153, 225, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: #2d3748;
            border: 1px solid #4a5568;
            border-radius: 16px;
            color: #e2e8f0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            text-align: center;
        }
        .btn-secondary:active {
            background: #4a5568;
        }
        .note {
            margin-top: 20px;
            color: #718096;
            font-size: 0.75rem;
            text-align: center;
            border-top: 1px solid #2d3748;
            padding-top: 15px;
        }
        .note strong {
            color: #f6ad55;
        }
        .toast-msg {
            background: #2d3748;
            color: #fbd38d;
            padding: 10px 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            border-right: 4px solid #f6ad55;
            display: none;
        }
        .toast-msg.show {
            display: block;
        }
        .small-icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>
            ✉️ الإرسال السريع
            <span>Gmail</span>
        </h2>

        <form id="emailForm">
            <div class="input-group">
                <label>📧 البريد المستلم (المُرسَل إليه)</label>
                <input type="email" id="toEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>📌 الموضوع</label>
                <input type="text" id="subject" placeholder="عنوان البريد..." required>
            </div>
            <div class="input-group">
                <label>📝 محتوى الرسالة</label>
                <textarea id="body" placeholder="اكتب نص الرسالة هنا..." required></textarea>
            </div>

            <div class="btn-group">
                <!-- الزر الرئيسي (mailto) ده اللي هيفتح التطبيق أو البريد الافتراضي -->
                <button type="submit" class="btn-primary" id="mainBtn">
                    <span class="small-icon">📨</span> فتح البريد (التطبيق)
                </button>
                
                <!-- الزر الاحتياطي (Gmail ويب) لو الأول ماظبطش -->
                <button type="button" class="btn-secondary" id="webBtn">
                    <span class="small-icon">🌐</span> فتح Gmail في المتصفح (احتياطي)
                </button>
            </div>
        </form>

        <div id="infoToast" class="toast-msg">
            ✅ جارٍ الفتح...
        </div>

        <div class="note">
            ⚡ الزر الأول بيفتح <strong>التطبيق</strong> مباشرة (Gmail أو البريد الافتراضي). <br>
            لو ماظبطش، استخدم الزر الثاني (المتصفح) واشتغل على طول.
        </div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const toast = document.getElementById('infoToast');
        const toInput = document.getElementById('toEmail');
        const subInput = document.getElementById('subject');
        const bodyInput = document.getElementById('body');
        const webBtn = document.getElementById('webBtn');

        // دالة مساعدة لعرض الإشعار
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 5000);
        }

        // دالة لجلب البيانات وتجهيز الرابط
        function getPreparedLink(type) {
            const to = toInput.value.trim();
            const subject = subInput.value.trim();
            const body = bodyInput.value.trim();

            if (!to || !subject || !body) {
                alert('⚠️ من فضلك املأ جميع الحقول!');
                return null;
            }

            const encSub = encodeURIComponent(subject);
            const encBody = encodeURIComponent(body);

            if (type === 'mailto') {
                // بيروح للتطبيق الافتراضي (Gmail لو هو الافتراضي)
                return `mailto:${to}?subject=${encSub}&body=${encBody}`;
            } else {
                // بيروح لـ Gmail عبر المتصفح (ضمانة)
                return `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${encSub}&body=${encBody}`;
            }
        }

        // عند الضغط على الزر الأول (التطبيق)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const link = getPreparedLink('mailto');
            if (!link) return;

            showToast(`✅ جارٍ فتح البريد... المستلم: ${toInput.value}`);
            
            // نفتح الرابط في نفس التبويب عشان يروح للتطبيق
            window.location.href = link;

            // نفصل الحقول عشان نجهز للجاية
            toInput.value = '';
            subInput.value = '';
            bodyInput.value = '';
        });

        // عند الضغط على الزر الثاني (المتصفح - احتياطي)
        webBtn.addEventListener('click', function() {
            const link = getPreparedLink('web');
            if (!link) return;

            showToast(`✅ جارٍ فتح Gmail في المتصفح... المستلم: ${toInput.value}`);
            
            // نفتح في تبويب جديد عشان الموقع يفضل مفتوح
            window.open(link, '_blank');

            // نفصل الحقول عشان نجهز للجاية
            toInput.value = '';
            subInput.value = '';
            bodyInput.value = '';
        });
    </script>

</body>
</html>
