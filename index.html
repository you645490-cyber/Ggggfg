<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⫷ فِــيْلَــقُ مِــدْجَــايْ 𓂀⃝☥ ⫸ 𝐀𝐊7</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Cinzel', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0505;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== الخلفية (ثابتة وخفيفة) ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://as1.ftcdn.net/v2/jpg/02/18/99/90/1000_F_218999080_QqP6LJcPqZ6d5usYw8upuFoRyBM4TCCk.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0.2;
            z-index: 0;
        }

        /* ===== زخارف هيروغليفية (قليلة وخفيفة) ===== */
        .hieroglyphs-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            font-size: 5rem;
            color: rgba(212, 175, 55, 0.03);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-content: space-evenly;
            animation: floatSlow 25s ease-in-out infinite alternate;
            will-change: transform;
        }
        @keyframes floatSlow {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.02); }
        }
        .hieroglyphs-bg span {
            display: inline-block;
            opacity: 0.6;
        }

        /* ===== الكارت الرئيسي (أفخم وأسرع) ===== */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(8, 4, 4, 0.9);
            padding: 40px 35px;
            border-radius: 50px;
            max-width: 540px;
            width: 100%;
            border: 1px solid #b8860b;
            box-shadow: 
                0 0 40px rgba(212, 175, 55, 0.2),
                0 0 80px rgba(212, 175, 55, 0.05),
                inset 0 0 60px rgba(212, 175, 55, 0.03);
            transition: 0.4s;
        }

        /* ===== شريط ذهبي متحرك ===== */
        .gold-bar {
            width: 80%;
            height: 2px;
            margin: 0 auto 25px auto;
            background: linear-gradient(90deg, transparent, #d4af37, #f5e6a3, #b8860b, transparent);
            border-radius: 10px;
            animation: barSlide 4s linear infinite;
            background-size: 200% 100%;
            will-change: background-position;
        }
        @keyframes barSlide {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ===== العنوان (توهج ذهبي متلألئ) ===== */
        .header-title {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-title h1 {
            font-family: 'Cinzel', 'Cairo', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #f5e6a3;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3), 0 0 40px rgba(212, 175, 55, 0.1);
            line-height: 1.5;
            letter-spacing: 3px;
            animation: glowText 3s ease-in-out infinite alternate;
        }
        @keyframes glowText {
            0% { text-shadow: 0 0 20px rgba(212, 175, 55, 0.2), 0 0 40px rgba(212, 175, 55, 0.05); }
            100% { text-shadow: 0 0 40px rgba(212, 175, 55, 0.6), 0 0 80px rgba(212, 175, 55, 0.15); }
        }
        .header-title h1 .highlight { color: #d4af37; text-shadow: 0 0 30px rgba(212, 175, 55, 0.8); }
        .header-title h1 small {
            display: block;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            color: #b8860b;
            letter-spacing: 6px;
            margin-top: 8px;
            border-top: 1px dashed rgba(212, 175, 55, 0.2);
            padding-top: 12px;
            font-weight: 400;
            animation: none;
            text-shadow: none;
        }

        /* ===== الحقول (بتوهج ذهبي عند التركيز) ===== */
        .input-group {
            margin-bottom: 22px;
        }
        .input-group label {
            display: block;
            color: #d4af37;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 2px;
            font-family: 'Cinzel', sans-serif;
        }
        .input-group label i { font-style: normal; margin-left: 10px; color: #f5e6a3; }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #7a5a2a;
            border-radius: 20px;
            color: #f5e6d3;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.6);
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2), inset 0 4px 15px rgba(0, 0, 0, 0.6);
            background: rgba(20, 10, 5, 0.95);
            transform: scale(1.01);
        }
        .input-group textarea { min-height: 120px; resize: vertical; }

        /* ===== الأزرار ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 15px;
        }
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #d4af37, #b8860b, #8b6508);
            border: none;
            border-radius: 20px;
            color: #0a0505;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 30px rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-family: 'Cinzel', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            animation: shimmer 5s infinite;
            will-change: transform;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .btn-primary:active { transform: scale(0.96); }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid #b8860b;
            border-radius: 20px;
            color: #d4af37;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Cairo', sans-serif;
        }
        .btn-secondary:active { background: rgba(212, 175, 55, 0.15); border-color: #d4af37; transform: scale(0.98); }

        .btn-clear {
            width: 100%;
            padding: 12px;
            background: rgba(100, 50, 30, 0.1);
            border: 1px dashed #7a3a2a;
            border-radius: 16px;
            color: #a06040;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .btn-clear:active { background: rgba(100, 50, 30, 0.2); border-color: #a06040; }

        /* ===== عداد الإرسال (الجزء الجديد) ===== */
        .counter-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 15px 20px;
        }
        .counter-display {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Cinzel', sans-serif;
            color: #f5e6a3;
            font-size: 1rem;
            letter-spacing: 2px;
        }
        .counter-display .number {
            font-size: 2.2rem;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            min-width: 50px;
            text-align: center;
            direction: ltr;
        }
        .btn-reset-counter {
            padding: 8px 20px;
            background: rgba(200, 50, 50, 0.1);
            border: 1px solid #7a3a2a;
            border-radius: 30px;
            color: #d4af37;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .btn-reset-counter:active {
            background: rgba(200, 50, 50, 0.2);
            border-color: #a06040;
            transform: scale(0.95);
        }

        /* ===== الإشعارات ===== */
        .toast-msg {
            background: rgba(10, 5, 5, 0.9);
            border-right: 4px solid #d4af37;
            color: #f5e6d3;
            padding: 14px 20px;
            border-radius: 16px;
            margin-top: 18px;
            font-size: 0.95rem;
            text-align: center;
            display: none;
            border-left: 1px solid rgba(212, 175, 55, 0.1);
        }
        .toast-msg.show { display: block; animation: fadeSlide 0.4s ease; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .footer-note {
            margin-top: 20px;
            text-align: center;
            color: #7a6a5a;
            font-size: 0.7rem;
            border-top: 1px solid rgba(212, 175, 55, 0.05);
            padding-top: 15px;
            letter-spacing: 1px;
            font-family: 'Cinzel', sans-serif;
        }
        .footer-note strong { color: #d4af37; }
        .icon-lg { font-size: 1.6rem; }

        @media (max-width: 480px) {
            .card { padding: 20px 15px; border-radius: 30px; }
            .header-title h1 { font-size: 1.4rem; }
            .btn-primary { font-size: 1rem; padding: 15px; }
            .counter-section { flex-direction: column; align-items: stretch; text-align: center; }
            .counter-display { justify-content: center; }
            .hieroglyphs-bg { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <!-- ===== زخارف ===== -->
    <div class="hieroglyphs-bg">
        <span>𓂀</span> <span>𓋹</span> <span>𓆣</span> 
        <span>𓅃</span> <span>𓂀</span> <span>𓋹</span>
    </div>

    <!-- ===== الكارت ===== -->
    <div class="card">
        <div class="gold-bar"></div>

        <div class="header-title">
            <h1>
                <span class="highlight">𓂀</span>
                ⫷ فِــيْلَــقُ مِــدْجَــايْ
                <span style="display:inline-block;color:#d4af37;">𓂀⃝☥</span>
                ⫸
                <span style="color:#f5e6a3;font-size:1.8rem;">𝐀𝐊7</span>
                <small>⚜️ الإرسال السريع إلى البريد الإلكتروني ⚜️</small>
            </h1>
        </div>

        <form id="emailForm">
            <div class="input-group">
                <label><i>𓋹</i> البريد المستلم</label>
                <input type="email" id="toEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label><i>𓆣</i> الموضوع</label>
                <input type="text" id="subject" placeholder="عنوان البريد..." required>
            </div>
            <div class="input-group">
                <label><i>𓅃</i> محتوى الرسالة</label>
                <textarea id="body" placeholder="اكتب نص الرسالة هنا..." required></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-primary">
                    <span class="icon-lg">📨</span> إرسال عبر البريد (تطبيق)
                </button>
                <button type="button" class="btn-secondary" id="webBtn">
                    <span class="icon-lg">🌐</span> فتح Gmail في المتصفح
                </button>
                <button type="button" class="btn-clear" id="clearBtn">
                    🗑️ تفريغ الحقول (بداية جديدة)
                </button>
            </div>
        </form>

        <!-- ===== عداد الإرسال ===== -->
        <div class="counter-section">
            <div class="counter-display">
                <span>🏛️ عدد الإرسالات:</span>
                <span class="number" id="sendCounter">0</span>
            </div>
            <button class="btn-reset-counter" id="resetCounterBtn">🔄 تصفير العداد</button>
        </div>

        <div id="infoToast" class="toast-msg">✅ تم التوجيه بنجاح...</div>
        <div class="footer-note"><strong>𓂀</strong> البيانات تبقى محفوظة للتعديل السريع <strong>𓋹</strong></div>
    </div>

    <script>
        // ===== عداد الإرسال (التخزين المحلي) =====
        const COUNTER_KEY = 'ak7_send_count';
        let sendCount = parseInt(localStorage.getItem(COUNTER_KEY)) || 0;

        // عناصر العداد
        const counterDisplay = document.getElementById('sendCounter');
        const resetCounterBtn = document.getElementById('resetCounterBtn');

        // دالة تحديث العداد في الواجهة
        function updateCounterDisplay() {
            counterDisplay.textContent = sendCount;
        }

        // دالة زيادة العداد
        function incrementCounter() {
            sendCount++;
            localStorage.setItem(COUNTER_KEY, sendCount);
            updateCounterDisplay();
        }

        // دالة تصفير العداد
        function resetCounter() {
            if (confirm('⚠️ هل أنت متأكد من تصفير عداد الإرسالات؟')) {
                sendCount = 0;
                localStorage.setItem(COUNTER_KEY, sendCount);
                updateCounterDisplay();
                showToast('🗑️ تم تصفير العداد بنجاح.');
            }
        }

        // ===== باقي عناصر الواجهة =====
        const form = document.getElementById('emailForm');
        const toast = document.getElementById('infoToast');
        const toInput = document.getElementById('toEmail');
        const subInput = document.getElementById('subject');
        const bodyInput = document.getElementById('body');
        const webBtn = document.getElementById('webBtn');
        const clearBtn = document.getElementById('clearBtn');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function getPreparedLink(type) {
            const to = toInput.value.trim();
            const subject = subInput.value.trim();
            const body = bodyInput.value.trim();
            if (!to || !subject || !body) {
                alert('⚠️ من فضلك املأ جميع الحقول!');
                return null;
            }
            const encSub = encodeURIComponent(subject);
            const encBody = encodeURIComponent(body);
            if (type === 'mailto') {
                return `mailto:${to}?subject=${encSub}&body=${encBody}`;
            } else {
                return `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${encSub}&body=${encBody}`;
            }
        }

        // ===== حدث الإرسال (الزر الرئيسي) =====
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const link = getPreparedLink('mailto');
            if (!link) return;
            
            // ✅ زيادة العداد عند الإرسال
            incrementCounter();
            
            showToast(`✅ جارٍ فتح البريد... المستلم: ${toInput.value}`);
            window.location.href = link;
        });

        // ===== زر المتصفح (Gmail ويب) =====
        webBtn.addEventListener('click', function() {
            const link = getPreparedLink('web');
            if (!link) return;
            
            // ✅ زيادة العداد عند الإرسال
            incrementCounter();
            
            showToast(`✅ جارٍ فتح Gmail في المتصفح... المستلم: ${toInput.value}`);
            window.open(link, '_blank');
        });

        // ===== زر تفريغ الحقول =====
        clearBtn.addEventListener('click', function() {
            if (confirm('⚠️ هل أنت متأكد؟ هيمسح كل البيانات.')) {
                toInput.value = '';
                subInput.value = '';
                bodyInput.value = '';
                showToast('🗑️ تم تفريغ الحقول.');
            }
        });

        // ===== زر تصفير العداد =====
        resetCounterBtn.addEventListener('click', resetCounter);

        // ===== تهيئة العداد عند تحميل الصفحة =====
        updateCounterDisplay();
    </script>
</body>
</html>
