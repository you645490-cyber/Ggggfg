<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⫷ فِــيْلَــقُ مِــدْجَــايْ 𓂀⃝☥ ⫸ 𝐀𝐊7</title>
    <!-- خط أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #1a0f0a 0%, #0a0505 70%, #000000 100%);
            padding: 20px;
            position: relative;
        }

        /* الخلفية الفرعونية (زخارف ذهبية خافتة) */
        body::before {
            content: "𓂀 𓋹 𓆣 𓅃 𓂀 𓋹 𓆣 𓅃";
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            font-size: 4rem;
            color: rgba(212, 175, 55, 0.03);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            pointer-events: none;
            transform: rotate(-5deg);
            letter-spacing: 40px;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.01) 0px, rgba(212, 175, 55, 0.01) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* البطاقة الرئيسية */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(10, 8, 8, 0.85);
            backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 40px 40px 40px 40px;
            max-width: 500px;
            width: 100%;
            border: 2px solid #b8860b;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.15), inset 0 0 50px rgba(212, 175, 55, 0.02);
            transition: 0.3s;
        }

        /* الزوايا الفرعونية (تزيين) */
        .card::before {
            content: "𓂀";
            position: absolute;
            top: -18px;
            right: -10px;
            font-size: 3rem;
            color: #d4af37;
            opacity: 0.3;
            transform: rotate(15deg);
        }

        .card::after {
            content: "𓋹";
            position: absolute;
            bottom: -18px;
            left: -10px;
            font-size: 3rem;
            color: #d4af37;
            opacity: 0.3;
            transform: rotate(-15deg);
        }

        /* العنوان الفخم */
        .header-title {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 20px;
        }

        .header-title h1 {
            font-size: 1.9rem;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3), 0 0 60px rgba(212, 175, 55, 0.1);
            line-height: 1.4;
            letter-spacing: 2px;
        }

        .header-title h1 small {
            display: block;
            font-size: 0.9rem;
            color: #b8860b;
            font-weight: 400;
            text-shadow: none;
            letter-spacing: 5px;
            margin-top: 5px;
            border-top: 1px dashed rgba(212, 175, 55, 0.2);
            padding-top: 10px;
        }

        .header-title .sub-icon {
            font-size: 1.5rem;
            color: #d4af37;
            margin: 0 5px;
        }

        /* الحقول */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #d4af37;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .input-group label i {
            margin-left: 8px;
            font-style: normal;
            color: #b8860b;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 15px 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #b8860b;
            border-radius: 16px;
            color: #f5e6d3;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), inset 0 2px 10px rgba(0, 0, 0, 0.5);
            background: rgba(20, 10, 5, 0.8);
        }

        .input-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: #7a6a5a;
            font-weight: 400;
        }

        /* الأزرار */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            border: none;
            border-radius: 16px;
            color: #0a0505;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Tajawal', sans-serif;
            letter-spacing: 1px;
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #b8860b;
            border-radius: 16px;
            color: #d4af37;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-secondary:active {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
        }

        .btn-clear {
            width: 100%;
            padding: 12px;
            background: rgba(255, 0, 0, 0.05);
            border: 1px dashed #7a3a2a;
            border-radius: 16px;
            color: #a06040;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
        }

        .btn-clear:active {
            background: rgba(255, 0, 0, 0.1);
            border-color: #a06040;
        }

        /* التنبيهات */
        .toast-msg {
            background: rgba(212, 175, 55, 0.1);
            border-right: 4px solid #d4af37;
            color: #f5e6d3;
            padding: 12px 18px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            backdrop-filter: blur(5px);
        }

        .toast-msg.show {
            display: block;
        }

        .footer-note {
            margin-top: 25px;
            text-align: center;
            color: #7a6a5a;
            font-size: 0.75rem;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            padding-top: 18px;
            letter-spacing: 1px;
        }

        .footer-note strong {
            color: #d4af37;
        }

        /* أيقونات صغيرة */
        .icon-lg {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- العنوان الفخم -->
        <div class="header-title">
            <h1>
                <span class="sub-icon">𓂀</span>
                ⫷ فِــيْلَــقُ مِــدْجَــايْ
                <span style="display:inline-block;">𓂀⃝☥</span>
                ⫸
                <span style="color:#f5e6d3;font-size:1.5rem;">𝐀𝐊7</span>
                <small>⚜️ الإرسال السريع إلى البريد الإلكتروني ⚜️</small>
            </h1>
        </div>

        <!-- النموذج -->
        <form id="emailForm">
            <div class="input-group">
                <label><i>𓋹</i> البريد المستلم (المُرسَل إليه)</label>
                <input type="email" id="toEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label><i>𓆣</i> الموضوع</label>
                <input type="text" id="subject" placeholder="عنوان البريد..." required>
            </div>
            <div class="input-group">
                <label><i>𓅃</i> محتوى الرسالة</label>
                <textarea id="body" placeholder="اكتب نص الرسالة هنا..." required></textarea>
            </div>

            <div class="btn-group">
                <!-- الزر الرئيسي (يفتح التطبيق أو البريد الافتراضي) -->
                <button type="submit" class="btn-primary">
                    <span class="icon-lg">📨</span> إرسال عبر البريد (تطبيق)
                </button>

                <!-- الزر الاحتياطي (يفتح Gmail في المتصفح) -->
                <button type="button" class="btn-secondary" id="webBtn">
                    <span class="icon-lg">🌐</span> فتح Gmail في المتصفح
                </button>

                <!-- زر تفريغ الحقول (لو عايز تبدأ من جديد) -->
                <button type="button" class="btn-clear" id="clearBtn">
                    🗑️ تفريغ جميع الحقول (ابدأ من الصفر)
                </button>
            </div>
        </form>

        <!-- رسالة التأكيد -->
        <div id="infoToast" class="toast-msg">
            ✅ تم التوجيه بنجاح...
        </div>

        <div class="footer-note">
            ⚡ البيانات <strong>لا تمسح</strong> بعد الإرسال عشان تعدل عليها بسرعة.
            <br> استخدم زر "تفريغ الحقول" لو عايز تبدأ من جديد.
        </div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const toast = document.getElementById('infoToast');
        const toInput = document.getElementById('toEmail');
        const subInput = document.getElementById('subject');
        const bodyInput = document.getElementById('body');
        const webBtn = document.getElementById('webBtn');
        const clearBtn = document.getElementById('clearBtn');

        // دالة عرض الإشعار
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 5000);
        }

        // دالة تجهيز الرابط
        function getPreparedLink(type) {
            const to = toInput.value.trim();
            const subject = subInput.value.trim();
            const body = bodyInput.value.trim();

            if (!to || !subject || !body) {
                alert('⚠️ من فضلك املأ جميع الحقول!');
                return null;
            }

            const encSub = encodeURIComponent(subject);
            const encBody = encodeURIComponent(body);

            if (type === 'mailto') {
                return `mailto:${to}?subject=${encSub}&body=${encBody}`;
            } else {
                return `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${encSub}&body=${encBody}`;
            }
        }

        // الزر الأول (التطبيق) - الحقول تفضل ممتلئة
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const link = getPreparedLink('mailto');
            if (!link) return;

            showToast(`✅ جارٍ فتح البريد... المستلم: ${toInput.value}`);
            window.location.href = link;

            // ❌ مش بنفرغ الحقول هنا عشان تفضل جاهزة للتعديل
        });

        // الزر الثاني (المتصفح) - الحقول تفضل ممتلئة
        webBtn.addEventListener('click', function() {
            const link = getPreparedLink('web');
            if (!link) return;

            showToast(`✅ جارٍ فتح Gmail في المتصفح... المستلم: ${toInput.value}`);
            window.open(link, '_blank');
        });

        // زر تفريغ الحقول (عشان تبدأ من الصفر)
        clearBtn.addEventListener('click', function() {
            if (confirm('⚠️ هل أنت متأكد؟ هيمسح كل البيانات اللي كتبتها.')) {
                toInput.value = '';
                subInput.value = '';
                bodyInput.value = '';
                showToast('🗑️ تم تفريغ جميع الحقول.');
            }
        });
    </script>

</body>
</html>
